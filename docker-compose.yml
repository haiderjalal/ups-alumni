name: ups-alumni

# Local development services only. Credentials here are placeholders for a
# developer machine and must be replaced before any shared deployment.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ups_alumni
      POSTGRES_USER: ups_app
      POSTGRES_PASSWORD: ups_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ups_app -d ups_alumni"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ups_minio
      MINIO_ROOT_PASSWORD: ups_minio_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
